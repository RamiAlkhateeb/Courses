name: CI

on:
  pull_request:
  push:
    branches-ignore: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm test
      # Type-check + production build, with the same base path as the real deploy.
      - run: npm run build
        env:
          GITHUB_PAGES: 'true'
      - run: npm run check:bundle

  # Browser smoke tests against the production build served under the Pages base path (e2e/, playwright.config.ts).
  e2e:
    # Pinned: ubuntu-latest is Ubuntu 26.04, where Playwright 1.56 cannot install Chromium
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      # The runner's Microsoft apt source (packages.microsoft.com) answers 403, which stops apt and so Playwright's
      # system dependencies; nothing here needs it, so it goes first
      - run: sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list /etc/apt/sources.list.d/microsoft-prod.sources
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
