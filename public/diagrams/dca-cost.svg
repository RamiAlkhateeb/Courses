<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 210" font-family="Instrument Sans, Helvetica, Arial, sans-serif">
  <!-- 100 a month at prices 10, 5 and 8: the average price seen is about 7.67, the average cost per unit about
       7.06. Numbers only: the title, caption and alt text are in the lesson, in the reader's language. -->
  <line x1="12" y1="176" x2="308" y2="176" stroke="#D0E7E6" stroke-width="2"/>
  <rect x="56" y="54" width="80" height="122" rx="10" fill="#95CCDD"/>
  <rect x="184" y="64" width="80" height="112" rx="10" fill="#4274D9"/>
  <g font-size="18" font-weight="700" fill="#293681" text-anchor="middle">
    <text x="96" y="44">≈7.67</text>
    <text x="224" y="54">≈7.06</text>
  </g>
</svg>
