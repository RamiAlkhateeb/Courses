<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 210" font-family="Instrument Sans, Helvetica, Arial, sans-serif">
  <!-- One illustrative year of a fictional company, in millions: revenue 1,000 (indigo), costs 850 (oops red, hanging
       from the top of revenue), profit 150 (blue), a 15% margin. Scale: 1,000 = 150px. Numbers only: the words are in the lesson. -->
  <line x1="12" y1="176" x2="308" y2="176" stroke="#D0E7E6" stroke-width="2"/>
  <line x1="98" y1="26" x2="128" y2="26" stroke="#5B678F" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="192" y1="153.5" x2="222" y2="153.5" stroke="#5B678F" stroke-width="1.5" stroke-dasharray="4 4"/>
  <rect x="34" y="26" width="64" height="150" rx="6" fill="#293681"/>
  <rect x="128" y="26" width="64" height="127.5" rx="6" fill="#A8432B"/>
  <rect x="222" y="153.5" width="64" height="22.5" rx="6" fill="#4274D9"/>
  <g font-size="16" font-weight="700" text-anchor="middle">
    <text x="66" y="18" fill="#293681">1,000</text>
    <text x="160" y="18" fill="#A8432B">−850</text>
    <text x="254" y="145" fill="#3560C7">150</text>
  </g>
  <text x="254" y="120" font-size="14" font-weight="600" fill="#5B678F" text-anchor="middle">15%</text>
</svg>
