<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 210" font-family="Instrument Sans, Helvetica, Arial, sans-serif">
  <!-- 10,000 at 6% a year for 30 years: growth untaxed while invested (indigo) vs 20% tax on each year's growth,
       so 4.8% a year (sky). Values at 0, 10, 20, 30 years; end values and the gap on the right. Numbers only. -->
  <line x1="20" y1="180" x2="236" y2="180" stroke="#D0E7E6" stroke-width="2"/>
  <polyline points="30,154 97,133.4 163,96.5 230,30.7" fill="none" stroke="#293681" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="30,154 97,138.4 163,113.6 230,73.9" fill="none" stroke="#95CCDD" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="230" cy="30.7" r="6" fill="#293681"/>
  <circle cx="230" cy="73.9" r="6" fill="#95CCDD"/>
  <g font-size="15" font-weight="700">
    <text x="244" y="36" fill="#293681">57,400</text>
    <text x="244" y="79" fill="#3560C7">40,800</text>
    <text x="244" y="113" fill="#A8432B">−16,600</text>
  </g>
  <text x="30" y="172" font-size="13" font-weight="600" fill="#5B678F">10,000</text>
  <g font-size="14" font-weight="600" fill="#5B678F" text-anchor="middle">
    <text x="30" y="200">0</text>
    <text x="97" y="200">10</text>
    <text x="163" y="200">20</text>
    <text x="230" y="200">30</text>
  </g>
</svg>
