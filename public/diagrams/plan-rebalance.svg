<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" font-family="Instrument Sans, Helvetica, Arial, sans-serif">
  <!-- Rebalancing, left to right: the 60/40 target, the drift to 66/34 after a strong year for stocks, and back
       to 60/40. Dark: stocks. Light: bonds. Scale: 100% = 160px. Numbers only: the words are in the lesson. -->
  <rect x="24" y="20" width="64" height="96" fill="#293681"/>
  <rect x="24" y="116" width="64" height="64" fill="#95CCDD"/>
  <rect x="128" y="20" width="64" height="106" fill="#293681"/>
  <rect x="128" y="126" width="64" height="54" fill="#95CCDD"/>
  <rect x="232" y="20" width="64" height="96" fill="#293681"/>
  <rect x="232" y="116" width="64" height="64" fill="#95CCDD"/>
  <path d="M96 100 H118 M112 94 L118 100 L112 106" stroke="#5B678F" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M200 100 H222 M216 94 L222 100 L216 106" stroke="#5B678F" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <g font-size="16" font-weight="700" text-anchor="middle">
    <text x="56" y="74" fill="#FFFFFF">60%</text>
    <text x="56" y="154" fill="#293681">40%</text>
    <text x="160" y="79" fill="#FFFFFF">66%</text>
    <text x="160" y="159" fill="#293681">34%</text>
    <text x="264" y="74" fill="#FFFFFF">60%</text>
    <text x="264" y="154" fill="#293681">40%</text>
  </g>
</svg>
