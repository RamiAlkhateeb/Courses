<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 210" font-family="Instrument Sans, Helvetica, Arial, sans-serif">
  <!-- 6% of a 30,000 salary is 1,800; an employer matching half adds 900, making 2,700 a year.
       Numbers only: the title, caption and alt text are in the lesson, in the reader's language. -->
  <line x1="12" y1="180" x2="308" y2="180" stroke="#D0E7E6" stroke-width="2"/>
  <rect x="56" y="74" width="80" height="106" rx="10" fill="#293681"/>
  <rect x="184" y="74" width="80" height="106" rx="10" fill="#293681"/>
  <rect x="184" y="20" width="80" height="52" rx="10" fill="#4274D9"/>
  <g font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">
    <text x="96" y="134">1,800</text>
    <text x="224" y="134">1,800</text>
    <text x="224" y="52">+900</text>
  </g>
  <g font-size="16" font-weight="700" fill="#293681" text-anchor="middle">
    <text x="96" y="64">1,800</text>
    <text x="224" y="202">2,700</text>
  </g>
</svg>
