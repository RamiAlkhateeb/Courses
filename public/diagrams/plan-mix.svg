<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" font-family="Instrument Sans, Helvetica, Arial, sans-serif">
  <!-- Illustrative splits for three goals, by years until the money is needed (1, 5, 25, left to right).
       Dark: stocks. Blue: bonds. Light: cash. Scale: 100% = 160px. Numbers only: the words are in the lesson. -->
  <line x1="12" y1="180" x2="308" y2="180" stroke="#5B678F" stroke-width="1.5"/>
  <!-- 1 year: 100% cash -->
  <rect x="40" y="20" width="60" height="160" fill="#95CCDD"/>
  <!-- 5 years: 40 / 50 / 10 -->
  <rect x="130" y="20" width="60" height="64" fill="#293681"/>
  <rect x="130" y="84" width="60" height="80" fill="#4274D9"/>
  <rect x="130" y="164" width="60" height="16" fill="#95CCDD"/>
  <!-- 25 years: 80 / 10 / 10 -->
  <rect x="220" y="20" width="60" height="128" fill="#293681"/>
  <rect x="220" y="148" width="60" height="16" fill="#4274D9"/>
  <rect x="220" y="164" width="60" height="16" fill="#95CCDD"/>
  <g font-weight="700" text-anchor="middle">
    <text x="70" y="105" font-size="15" fill="#293681">100%</text>
    <text x="160" y="57" font-size="15" fill="#FFFFFF">40%</text>
    <text x="160" y="129" font-size="15" fill="#FFFFFF">50%</text>
    <text x="160" y="177" font-size="12" fill="#293681">10%</text>
    <text x="250" y="89" font-size="15" fill="#FFFFFF">80%</text>
    <text x="250" y="161" font-size="12" fill="#FFFFFF">10%</text>
    <text x="250" y="177" font-size="12" fill="#293681">10%</text>
  </g>
  <g font-size="14" font-weight="700" fill="#5B678F" text-anchor="middle">
    <text x="70" y="204">1</text>
    <text x="160" y="204">5</text>
    <text x="250" y="204">25</text>
  </g>
</svg>
