<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 210" font-family="Instrument Sans, Helvetica, Arial, sans-serif">
  <!-- Illustrative worst year for three mixes of stocks / bonds: 30/70 −8%, 60/40 −18%, 90/10 −30%.
       Numbers only: the title, caption and alt text are in the lesson, in the reader's language. -->
  <line x1="12" y1="34" x2="308" y2="34" stroke="#D0E7E6" stroke-width="2"/>
  <rect x="36" y="34" width="64" height="36" rx="8" fill="#95CCDD"/>
  <rect x="128" y="34" width="64" height="80" rx="8" fill="#4274D9"/>
  <rect x="220" y="34" width="64" height="134" rx="10" fill="#293681"/>
  <g font-size="18" font-weight="700" fill="#293681" text-anchor="middle">
    <text x="68" y="92">−8%</text>
    <text x="160" y="136">−18%</text>
    <text x="252" y="190">−30%</text>
  </g>
  <g font-size="14" font-weight="600" fill="#5B678F" text-anchor="middle">
    <text x="68" y="22">30/70</text>
    <text x="160" y="22">60/40</text>
    <text x="252" y="22">90/10</text>
  </g>
</svg>
