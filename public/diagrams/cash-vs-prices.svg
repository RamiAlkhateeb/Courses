<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 210" font-family="Instrument Sans, Helvetica, Arial, sans-serif">
  <!-- 1,000 in savings at 1% a year for 10 years becomes 1,105, while what 1,000 bought now costs 1,344 at 3%
       inflation. Numbers only: the title, caption and alt text are in the lesson, in the reader's language. -->
  <line x1="12" y1="180" x2="308" y2="180" stroke="#D0E7E6" stroke-width="2"/>
  <rect x="24" y="76" width="72" height="104" rx="10" fill="#293681"/>
  <rect x="124" y="65" width="72" height="115" rx="10" fill="#4274D9"/>
  <rect x="224" y="40" width="72" height="140" rx="10" fill="none" stroke="#A8432B" stroke-width="3" stroke-dasharray="6 6"/>
  <g font-size="17" font-weight="700" fill="#293681" text-anchor="middle">
    <text x="60" y="66">1,000</text>
    <text x="160" y="55">1,105</text>
    <text x="260" y="30">1,344</text>
  </g>
  <g font-size="14" font-weight="600" fill="#5B678F" text-anchor="middle">
    <text x="60" y="200">0</text>
    <text x="160" y="200">10</text>
    <text x="260" y="200">10</text>
  </g>
</svg>
