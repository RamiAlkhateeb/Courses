<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 210" font-family="Instrument Sans, Helvetica, Arial, sans-serif">
  <!-- 100 invested each month at prices 10, 5 and 10 buys 10, 20 and 10 units: more units when the price is
       low. Numbers only: the title, caption and alt text are in the lesson, in the reader's language. -->
  <line x1="12" y1="170" x2="308" y2="170" stroke="#D0E7E6" stroke-width="2"/>
  <rect x="36" y="110" width="64" height="60" rx="8" fill="#95CCDD"/>
  <rect x="128" y="50" width="64" height="120" rx="10" fill="#4274D9"/>
  <rect x="220" y="110" width="64" height="60" rx="8" fill="#95CCDD"/>
  <g font-size="18" font-weight="700" fill="#293681" text-anchor="middle">
    <text x="68" y="100">10</text>
    <text x="160" y="40">20</text>
    <text x="252" y="100">10</text>
  </g>
  <g font-size="14" font-weight="600" fill="#5B678F" text-anchor="middle">
    <text x="68" y="192">@10</text>
    <text x="160" y="192">@5</text>
    <text x="252" y="192">@10</text>
  </g>
</svg>
