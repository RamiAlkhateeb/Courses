<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 210" font-family="Instrument Sans, Helvetica, Arial, sans-serif">
  <!-- A year of the same spending costs 20,000 at 65 and, at 3% inflation, about 27,000 at 75 and 40,700 at 89.
       Numbers only: the title, caption and alt text are in the lesson, in the reader's language. -->
  <line x1="12" y1="176" x2="308" y2="176" stroke="#D0E7E6" stroke-width="2"/>
  <rect x="36" y="107" width="64" height="69" rx="10" fill="#95CCDD"/>
  <rect x="128" y="83" width="64" height="93" rx="10" fill="#4274D9"/>
  <rect x="220" y="36" width="64" height="140" rx="10" fill="#293681"/>
  <g font-size="17" font-weight="700" fill="#293681" text-anchor="middle">
    <text x="68" y="97">20,000</text>
    <text x="160" y="73">≈26,900</text>
    <text x="252" y="26">≈40,700</text>
  </g>
  <g font-size="14" font-weight="600" fill="#5B678F" text-anchor="middle">
    <text x="68" y="198">65</text>
    <text x="160" y="198">75</text>
    <text x="252" y="198">89</text>
  </g>
</svg>
