<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 210" font-family="Instrument Sans, Helvetica, Arial, sans-serif">
  <!-- Profit doubles from 150 to 300 over ten years; with the same expectations the share price doubles from 20
       to 40. Numbers only: the title, caption and alt text are in the lesson, in the reader's language. -->
  <line x1="12" y1="176" x2="308" y2="176" stroke="#D0E7E6" stroke-width="2"/>
  <rect x="28" y="116" width="52" height="60" rx="8" fill="#95CCDD"/>
  <rect x="92" y="56" width="52" height="120" rx="10" fill="#95CCDD"/>
  <rect x="176" y="116" width="52" height="60" rx="8" fill="#293681"/>
  <rect x="240" y="56" width="52" height="120" rx="10" fill="#293681"/>
  <g font-size="17" font-weight="700" fill="#293681" text-anchor="middle">
    <text x="54" y="106">150</text>
    <text x="118" y="46">300</text>
    <text x="202" y="106">20</text>
    <text x="266" y="46">40</text>
  </g>
  <g font-size="14" font-weight="600" fill="#5B678F" text-anchor="middle">
    <text x="54" y="198">0</text>
    <text x="118" y="198">10</text>
    <text x="202" y="198">0</text>
    <text x="266" y="198">10</text>
  </g>
</svg>
