<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 210" font-family="Instrument Sans, Helvetica, Arial, sans-serif">
  <!-- Illustrative bad years: property −20%, gold −28%, crypto −75%. Numbers only: the title, caption and alt
       text are in the lesson, in the reader's language. -->
  <line x1="12" y1="30" x2="308" y2="30" stroke="#D0E7E6" stroke-width="2"/>
  <rect x="36" y="30" width="64" height="40" rx="8" fill="#95CCDD"/>
  <rect x="128" y="30" width="64" height="56" rx="8" fill="#4274D9"/>
  <rect x="220" y="30" width="64" height="150" rx="10" fill="#A8432B"/>
  <g font-size="18" font-weight="700" fill="#293681" text-anchor="middle">
    <text x="68" y="92">−20%</text>
    <text x="160" y="108">−28%</text>
    <text x="252" y="202">−75%</text>
  </g>
</svg>
