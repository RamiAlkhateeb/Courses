<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 210" font-family="Instrument Sans, Helvetica, Arial, sans-serif">
  <!-- 50/30/20 on a net income of 3,000: needs 1,500, wants 900, savings and extra debt payments 600. Numbers only: the title, caption and alt text are in the lesson, in the reader's language. -->
  <line x1="12" y1="176" x2="308" y2="176" stroke="#D0E7E6" stroke-width="2"/>
  <rect x="44" y="36" width="64" height="140" rx="10" fill="#293681"/>
  <rect x="128" y="92" width="64" height="84" rx="10" fill="#95CCDD"/>
  <rect x="212" y="120" width="64" height="56" rx="10" fill="#4274D9"/>
  <g font-size="16" font-weight="700" fill="#293681" text-anchor="middle">
    <text x="76" y="26">1,500</text>
    <text x="160" y="82">900</text>
    <text x="244" y="110">600</text>
  </g>
  <g font-size="14" font-weight="600" fill="#5B678F" text-anchor="middle">
    <text x="76" y="198">50%</text>
    <text x="160" y="198">30%</text>
    <text x="244" y="198">20%</text>
  </g>
</svg>
