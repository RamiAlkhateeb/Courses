<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 210" font-family="Instrument Sans, Helvetica, Arial, sans-serif">
  <!-- Years until each goal: 1, 2, 12 and 30. Numbers only: the title, caption and alt text are in the lesson,
       in the reader's language. -->
  <g font-size="16" font-weight="700" fill="#293681">
    <rect x="16" y="22" width="9" height="26" rx="5" fill="#95CCDD"/>
    <text x="34" y="41">1</text>
    <rect x="16" y="66" width="18" height="26" rx="5" fill="#95CCDD"/>
    <text x="43" y="85">2</text>
    <rect x="16" y="110" width="104" height="26" rx="8" fill="#4274D9"/>
    <text x="129" y="129">12</text>
    <rect x="16" y="154" width="260" height="26" rx="8" fill="#293681"/>
    <text x="284" y="173">30</text>
  </g>
</svg>
