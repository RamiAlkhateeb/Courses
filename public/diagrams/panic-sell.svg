<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 210" font-family="Instrument Sans, Helvetica, Arial, sans-serif">
  <!-- 1,000 falls to 700. Held, it is 1,100 a few years later; sold at the bottom, it stays 700.
       Numbers only: the title, caption and alt text are in the lesson, in the reader's language. -->
  <line x1="12" y1="176" x2="308" y2="176" stroke="#D0E7E6" stroke-width="2"/>
  <rect x="20" y="55" width="56" height="121" rx="10" fill="#293681"/>
  <rect x="92" y="91" width="56" height="85" rx="10" fill="#95CCDD"/>
  <rect x="164" y="43" width="56" height="133" rx="10" fill="#4274D9"/>
  <rect x="236" y="91" width="56" height="85" rx="10" fill="none" stroke="#A8432B" stroke-width="3" stroke-dasharray="6 6"/>
  <g font-size="16" font-weight="700" fill="#293681" text-anchor="middle">
    <text x="48" y="45">1,000</text>
    <text x="120" y="81">700</text>
    <text x="192" y="33">1,100</text>
    <text x="264" y="81">700</text>
  </g>
</svg>
