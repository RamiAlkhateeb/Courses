<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 210" font-family="Instrument Sans, Helvetica, Arial, sans-serif">
  <!-- One illustrative year: cash +2%, bonds −3%, stocks +18%. Three kinds of asset, three different results.
       Numbers only: the title, caption and alt text are in the lesson, in the reader's language. -->
  <line x1="12" y1="140" x2="308" y2="140" stroke="#D0E7E6" stroke-width="2"/>
  <rect x="36" y="128" width="64" height="12" rx="6" fill="#95CCDD"/>
  <rect x="128" y="140" width="64" height="18" rx="6" fill="#A8432B"/>
  <rect x="220" y="32" width="64" height="108" rx="10" fill="#293681"/>
  <g font-size="18" font-weight="700" fill="#293681" text-anchor="middle">
    <text x="68" y="118">+2%</text>
    <text x="160" y="180">−3%</text>
    <text x="252" y="22">+18%</text>
  </g>
</svg>
