<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 210" font-family="Instrument Sans, Helvetica, Arial, sans-serif">
  <!-- A glide path: the stock share is 90%, 75%, 60% and 40% with 40, 20, 10 and 0 years to the target.
       Numbers only: the title, caption and alt text are in the lesson, in the reader's language. -->
  <line x1="12" y1="176" x2="308" y2="176" stroke="#D0E7E6" stroke-width="2"/>
  <rect x="24" y="41" width="56" height="135" rx="10" fill="#293681"/>
  <rect x="96" y="63.5" width="56" height="112.5" rx="10" fill="#293681"/>
  <rect x="168" y="86" width="56" height="90" rx="10" fill="#4274D9"/>
  <rect x="240" y="116" width="56" height="60" rx="10" fill="#95CCDD"/>
  <g font-size="16" font-weight="700" fill="#293681" text-anchor="middle">
    <text x="52" y="31">90%</text>
    <text x="124" y="53.5">75%</text>
    <text x="196" y="76">60%</text>
    <text x="268" y="106">40%</text>
  </g>
  <g font-size="14" font-weight="600" fill="#5B678F" text-anchor="middle">
    <text x="52" y="198">40</text>
    <text x="124" y="198">20</text>
    <text x="196" y="198">10</text>
    <text x="268" y="198">0</text>
  </g>
</svg>
