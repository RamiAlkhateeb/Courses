<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 210" font-family="Instrument Sans, Helvetica, Arial, sans-serif">
  <!-- The same dividend of 0.80: at a price of 20 the yield is 4%; when the price halves to 10 it is 8%.
       Numbers only: the title, caption and alt text are in the lesson, in the reader's language. -->
  <line x1="12" y1="176" x2="308" y2="176" stroke="#D0E7E6" stroke-width="2"/>
  <rect x="56" y="36" width="80" height="140" rx="10" fill="#293681"/>
  <rect x="184" y="106" width="80" height="70" rx="10" fill="#A8432B"/>
  <g font-size="18" font-weight="700" fill="#293681" text-anchor="middle">
    <text x="96" y="26">20</text>
    <text x="224" y="96">10</text>
  </g>
  <g font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">
    <text x="96" y="112">4%</text>
    <text x="224" y="148">8%</text>
  </g>
  <g font-size="14" font-weight="600" fill="#5B678F" text-anchor="middle">
    <text x="96" y="198">0.80</text>
    <text x="224" y="198">0.80</text>
  </g>
</svg>
